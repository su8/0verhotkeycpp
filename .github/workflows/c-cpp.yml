name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install deps.
      run: sudo apt install libxcb1-dev libxcb-keysyms1-dev libx11-dev
    - name: make -j8
      run: make -j8