name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install deps.
      run: sudo apt install libxcb1-dev libxcb-keysyms1-dev libx11-dev
    - name: make -j8
      run: make -j8
    - name: make XCB -j8
      run: make XCB -j8
    - name: make BSD -j8
      run: make BSD -j8
  macos:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: make -XCB -j8
      run: curl -O https://distfiles.macports.org/MacPorts/MacPorts-2.12.6.tar.bz2;tar xf MacPorts-2.12.6.tar.bz2;cd MacPorts-2.12.6;./configure;make;sudo make install;sudo port install xcb;make XCB -j8
    - name: make BSD -j8
      run: make BSD -j8